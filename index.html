<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spacymineos archive</title>
  <meta name="description" content="Every project the Spacymineos organization has retired: archived, still readable, still forkable.">
  <meta name="theme-color" content="#060a1a">
  <meta property="og:title" content="Spacymineos archive">
  <meta property="og:description" content="Deprecated, not deleted. Retired projects from the Spacymineos organization.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://spacymineos.github.io/assets/img/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Schibsted+Grotesk:wght@400..700&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<a class="skip" href="#list">Skip to repositories</a>
<div class="sky" aria-hidden="true"><svg class="s-art" viewBox="14 6 100 116"><path d="M85.75 29.86 A24 24 0 1 0 64 64 A24 24 0 1 1 42.25 98.14" fill="none" stroke-width="13" stroke-linecap="round"/><circle cx="85.75" cy="50.14" r="7"/></svg></div>

<div class="wrap">
  <div class="bar">
    <a class="brand" href="./">
      <svg viewBox="14 6 100 116" aria-hidden="true"><path d="M85.75 29.86 A24 24 0 1 0 64 64 A24 24 0 1 1 42.25 98.14" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round"/><circle cx="85.75" cy="50.14" r="7" fill="var(--accent)"/></svg>
      Spacymineos
    </a>
    <a class="btn" href="https://github.com/Spacymineos" rel="noopener"><span>GitHub<span class="long"> organization</span></span></a>
  </div>

  <header class="hero">
    <h1>Deprecated, not deleted.</h1>
    <p class="lede">Every project this organization has retired, still readable and still forkable.</p>
    <p class="summary" id="summary" aria-live="polite">Loading repositories…</p>
  </header>

  <main id="main">
    <div class="controls">
      <label class="search">
        <span class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)">Search repositories by name, description or language</span>
        <input id="search" type="search" placeholder="Search repositories" autocomplete="off" spellcheck="false">
        <kbd aria-hidden="true">/</kbd>
      </label>
      <div class="filters">
        <div class="chips" id="chips" role="group" aria-label="Filter by language"></div>
        <div class="sort" role="group" aria-label="Sort order">
          <button class="chip" type="button" data-sort="updated" aria-pressed="true">Recently updated</button>
          <button class="chip" type="button" data-sort="name" aria-pressed="false">A to Z</button>
        </div>
      </div>
    </div>

    <div class="list" id="list" tabindex="-1">
      <div class="skeleton" style="--i:0"></div>
      <div class="skeleton" style="--i:1"></div>
      <div class="skeleton" style="--i:2"></div>
      <noscript><p class="state">The list loads from GitHub with JavaScript. You can browse every repository on the <a href="https://github.com/Spacymineos">Spacymineos organization page</a>.</p></noscript>
    </div>
  </main>

  <footer>
    <div class="foot-links">
      <span>Maintained by <a href="https://github.com/aminegames125" rel="noopener">@aminegames125</a></span>
      <a href="https://github.com/Spacymineos" rel="noopener">Spacymineos on GitHub</a>
      <a href="https://spacymineos.github.io/brand/">Brand kit</a>
      <span id="fetched"></span>
    </div>
    <div class="foot-name" aria-hidden="true">Spacymineos</div>
  </footer>
</div>

<script src="assets/js/app.js"></script>
</body>
</html>
